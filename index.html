<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diritto Proprio IVE</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Costituzioni e Direttori dell’Istituto del Verbo Incarnato — lettura e ricerca offline.">
<meta name="theme-color" content="#8E1B2B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diritto IVE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-crest.png" sizes="180x180">
<link rel="preload" href="fonts/eb-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/source-serif-4-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script>
  // apply saved theme before first paint
  try {
    var s = JSON.parse(localStorage.getItem('ive-it.settings') || '{}');
    if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
    if (s.size) document.documentElement.style.setProperty('--read-size', s.size + 'px');
  } catch (e) {}
</script>
</head>
<body>
<div id="progress" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <div class="topbar-in">
    <button class="icon-btn only-doc" id="btn-back" aria-label="Torna alla biblioteca" title="Biblioteca">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-btn only-doc" id="btn-toc" aria-label="Indice" title="Indice">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Inizio">
      <span class="brand-mark" aria-hidden="true">
        <img src="icons/crest-512.png" alt="" width="38" height="38">
      </span>
      <span class="brand-text">
        <span class="brand-title">Diritto Proprio</span>
        <span class="brand-sub">Istituto del Verbo Incarnato</span>
      </span>
    </a>
    <span class="doc-title only-doc" id="bar-doc-title"></span>
    <nav class="actions">
      <button class="icon-btn" id="btn-search" aria-label="Cerca" title="Cerca  ( / )">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      </button>
      <button class="icon-btn" id="btn-marks" aria-label="Segnalibri" title="Segnalibri">
        <svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Impostazioni" title="Impostazioni di lettura">
        <svg viewBox="0 0 24 24"><path d="M4 19h3.5M11 19h9M4 5h9M16.5 5H20M4 12h5M12.5 12H20"/><circle cx="9.25" cy="19" r="1.9"/><circle cx="14.75" cy="5" r="1.9"/><circle cx="10.75" cy="12" r="1.9"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<!-- table of contents drawer -->
<aside class="drawer" id="toc" aria-label="Indice del documento" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <div class="overline">Indice</div>
      <div class="drawer-title" id="toc-title"></div>
    </div>
    <button class="icon-btn" data-close aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <form class="goto" id="goto-form" autocomplete="off">
    <label for="goto-n">Vai al numero</label>
    <input id="goto-n" inputmode="numeric" pattern="[0-9]*" placeholder="n.">
    <button type="submit" class="btn small">Vai</button>
  </form>
  <ol class="toc-list" id="toc-list"></ol>
</aside>
<div class="scrim" id="scrim"></div>

<!-- settings sheet -->
<div class="sheet" id="settings" role="dialog" aria-modal="true" aria-label="Impostazioni" aria-hidden="true">
  <div class="sheet-card">
    <div class="sheet-head">
      <h2>Impostazioni</h2>
      <button class="icon-btn" data-close aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="field">
      <div class="field-label">Aspetto</div>
      <div class="seg" id="seg-theme">
        <button data-v="auto">Automatico</button>
        <button data-v="light">Chiaro</button>
        <button data-v="sepia">Seppia</button>
        <button data-v="dark">Scuro</button>
      </div>
    </div>
    <div class="field">
      <div class="field-label">Dimensione del testo <span id="size-val"></span></div>
      <div class="size-row">
        <span class="aa small">A</span>
        <input type="range" id="size" min="15" max="26" step="1">
        <span class="aa big">A</span>
      </div>
    </div>
    <div class="field">
      <div class="field-label">Carattere</div>
      <div class="seg" id="seg-font">
        <button data-v="serif">Classico</button>
        <button data-v="sans">Moderno</button>
      </div>
    </div>
    <div class="field about">
      <div class="field-label">Contenuto</div>
      <p id="about-line" class="muted"></p>
      <p id="offline-line" class="muted"></p>
      <div class="row-btns">
        <button class="btn" id="btn-update">Cerca aggiornamenti</button>
        <button class="btn ghost" id="btn-install" hidden>Installa l’applicazione</button>
      </div>
      <p id="ios-hint" class="muted small" hidden>Su iPhone/iPad: tocca <b>Condividi</b> e poi <b>Aggiungi alla schermata Home</b>.</p>
    </div>
  </div>
</div>

<!-- popover for notes & article actions -->
<div class="pop" id="pop" role="dialog" aria-hidden="true"><div class="pop-in" id="pop-in"></div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js" defer></script>
</body>
</html>
